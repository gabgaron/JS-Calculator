<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="calculatorBody">
        <div class="screenContainer">
            <input type="number" id="inputScreen">
        </div>
        <div class="memoryContainer">
            <button id="memoryClear">MC</button>
            <button id="memoryRecall">MR</button>
            <button id="memoryPlus">M+</button>
            <button id="memoryMinus">M-</button>
            <button id="memoryStore">MS</button>
            <button id="memoryDown">M&#8615;</button>
        </div>
        <div class="inputContainer">
            <button id="btnPercent">%</button>
            <button id="btnCE">CE</button>
            <button id="btnC">C</button>
            <button id="btnBackspace">⌫</button><br>
            <button id="btnReciprocal">1/x</button>
            <button id="btnSquare">x&sup2;</button>
            <button id="btnSqrt">&sup2;&radic;x</button>
            <button id="btnDivide">/</button><br>
            <button id="btn7">7</button>
            <button id="btn8">8</button>
            <button id="btn9">9</button>
            <button id="btnMultiply">*</button><br>
            <button id="btn4">4</button>
            <button id="btn5">5</button>
            <button id="btn6">6</button>
            <button id="btnMinus">-</button><br>
            <button id="btn1" onclick="keyPress()">1</button>
            <button id="btn2">2</button>
            <button id="btn3">3</button>
            <button id="btnPlus">+</button><br>
            <button id="btnPlusMinus">+/-</button>
            <button id="btn0">0</button>
            <button id="btnDot">.</button>
            <button id="btnEqual">=</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
